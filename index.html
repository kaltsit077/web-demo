<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>789罗德岛学院</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Orbitron:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" class="rh-app">
    <div id="screen-layer" class="rh-screen-layer"></div>

    <div id="battle-layout" class="rh-battle-layout">
      <div class="rh-battle-stage">
        <canvas id="game-canvas" aria-label="刷怪区"></canvas>

        <div class="rh-battle-hud">
          <div class="rh-battle-hud__top">
            <div class="rh-hud-chip rh-hud-chip--score">
              <span class="rh-hud-chip__k">分数</span>
              <span id="hud-score" class="rh-hud-chip__v">0</span>
            </div>
            <div class="rh-hud-chip rh-hud-chip--drop">
              <span class="rh-hud-chip__k">下降</span>
              <span id="hud-drop" class="rh-hud-chip__v">5.0s</span>
            </div>
            <div class="rh-hud-chip rh-hud-chip--hp">
              <span class="rh-hud-chip__k">HP</span>
              <span id="hud-hp" class="rh-hud-chip__v">5</span>
              <span id="hud-wall" class="rh-hud-chip__sub">越线 0/3</span>
            </div>
            <button type="button" id="hud-pause" class="rh-hud-pause" aria-label="暂停" title="暂停">暂停</button>
          </div>
          <p id="hud-meta" class="rh-battle-hud__meta"></p>
        </div>

        <p id="battle-aim-hint" class="rh-battle-aim-hint">按住拖拽瞄准 · 松手发射</p>
      </div>

      <div class="rh-battle-dock">
        <div class="rh-dock-board">
          <div class="rh-dock-section rh-dock-section--loaded">
            <span class="rh-dock-section__label">上弓</span>
            <div id="dock-loaded" class="rh-dock-loaded-slot"></div>
            <span id="dock-loaded-name" class="rh-dock-loaded-name">—</span>
          </div>
          <div class="rh-dock-divider" aria-hidden="true"></div>
          <div class="rh-dock-section rh-dock-section--queue">
            <span class="rh-dock-section__label">待命（点击换人）</span>
            <div id="dock-ops" class="rh-dock-ops"></div>
          </div>
        </div>
        <p class="rh-dock-note">道具栏将在后续关卡解锁</p>
      </div>
    </div>

    <div id="modal-layer" class="rh-modal-layer">
      <div id="modal-backdrop" class="rh-modal-backdrop">
        <div id="modal-content" class="rh-modal rh-panel"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
